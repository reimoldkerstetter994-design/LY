name: 每日抓取南农资环学硕考研资料

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scrape
        run: python main.py scrape -o data -v

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "今日抓取结果无文件变化，跳过提交。"
          else
            git commit -m "chore: 每日更新考研资料 $(date +%F)"
            git push
          fi
