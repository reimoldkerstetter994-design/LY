<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LY Dynamic Wallpapers</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage" class="stage lite" data-theme="storm">
    <div class="frame" id="frame">
      <div class="parallax" id="parallax">
        <div class="scene-wrap" id="sceneWrap">
          <img class="scene actor" id="actorA" src="assets/act/storm-l-1.jpg" alt="" draggable="false" />
          <img class="scene actor actor-b" id="actorB" src="assets/act/storm-l-2.jpg" alt="" draggable="false" />
          <div class="light-wash"></div>
          <div class="moon-beams"></div>
          <div class="window-glow"></div>
          <div class="lamp-bloom"></div>
          <div class="curtain curtain-left"></div>
          <div class="curtain curtain-right"></div>
          <div class="wind-veil"></div>
        </div>
      </div>
      <canvas id="fx" class="fx"></canvas>
      <div class="vignette"></div>
      <div class="hud" id="hud">
        <div class="hud-kicker">LY DYNAMIC</div>
        <div class="hud-title" id="hudTitle">Storm Neon</div>
        <div class="hud-sub" id="hudSub">人物动作时间轴 · P 竖/横</div>
      </div>
      <nav class="picker" id="picker"></nav>
    </div>

    <div class="chrome">
      <button class="chip" id="orientBtn" type="button">竖版</button>
      <div class="fps" id="fps">-- FPS</div>
    </div>
  </div>

  <script src="scenes.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
