<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlit Silver — 4K Dynamic Wallpaper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage" class="stage">
    <div class="parallax" id="parallax">
      <div class="scene-wrap" id="sceneWrap">
        <img
          class="scene"
          id="scene"
          src="assets/scene.png"
          alt="Moonlit silver-haired anime girl in a luxury bedroom"
          draggable="false"
        />
        <div class="light-wash"></div>
        <div class="moon-beams"></div>
        <div class="window-glow"></div>
        <div class="lamp-bloom"></div>
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
      </div>
    </div>

    <canvas id="fx" class="fx"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="letterbox"></div>

    <div class="hud" id="hud">
      <div class="hud-title">Moonlit Silver</div>
      <div class="hud-sub">4K 动态壁纸 · 按 F 全屏 · 移动鼠标产生视差</div>
    </div>
  </div>

  <script src="wallpaper.js"></script>
</body>
</html>
