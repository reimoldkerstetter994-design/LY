<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIGHTFALL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage" class="stage" data-theme="storm">
    <div class="frame" id="frame">
      <div class="parallax" id="parallax">
        <div class="scene-wrap" id="sceneWrap">
          <img class="scene" id="scene" src="assets/storm.jpg" alt="" draggable="false" />
          <div class="wash"></div>
        </div>
      </div>
      <canvas id="fx" class="fx"></canvas>
      <div class="vignette"></div>
      <div class="hud" id="hud">
        <div class="brand">NIGHTFALL</div>
        <div class="title" id="hudTitle">Storm Neon</div>
      </div>
      <div class="hint" id="hint">1–5 场景 · P 竖屏 · F 全屏</div>
      <nav class="picker" id="picker"></nav>
    </div>
  </div>
  <script src="scenes.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
