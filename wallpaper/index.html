<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>夜窗 · 动态壁纸</title>
  <style>
    :root {
      --panel: rgba(18, 10, 24, 0.62);
      --line: rgba(255, 214, 230, 0.28);
      --text: #f6e9f0;
      --muted: rgba(246, 233, 240, 0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #07040c;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: default;
    }

    #viewport.clean { cursor: none; }

    #cam {
      position: absolute;
      inset: -8%;
      transform-origin: 70% 46%;
      will-change: transform;
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2.8s ease-in-out;
      pointer-events: none;
    }

    .frame.on { opacity: 1; }

    .grade,
    .glow,
    .rays,
    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grade {
      background:
        radial-gradient(120% 92% at 74% 40%, transparent 28%, rgba(18, 8, 28, 0.18) 62%, rgba(5, 2, 12, 0.78) 100%),
        linear-gradient(90deg, rgba(16, 6, 24, 0.42) 0%, rgba(16, 6, 24, 0.08) 34%, transparent 58%);
    }

    .glow {
      background: radial-gradient(42% 56% at 76% 36%, rgba(255, 176, 206, 0.2), transparent 72%);
      mix-blend-mode: screen;
      animation: breathe 7.5s ease-in-out infinite;
    }

    .rays {
      background: repeating-linear-gradient(
        108deg,
        transparent 0 64px,
        rgba(255, 220, 236, 0.035) 64px 66px
      );
      mix-blend-mode: screen;
      animation: drift 22s linear infinite;
      opacity: 0.85;
    }

    #fx { width: 100%; height: 100%; }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-80px, 30px, 0); }
    }

    #hint, #panel {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      transition: opacity 0.6s ease;
    }

    #hint {
      bottom: 28px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    #panel {
      bottom: 24px;
      display: flex;
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      opacity: 0;
    }

    #panel.show { opacity: 1; }

    button {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { border-color: var(--line); background: rgba(255, 255, 255, 0.12); }
    button[aria-pressed="true"] { background: rgba(255, 170, 200, 0.22); }

    #viewport.clean #hint,
    #viewport.clean #panel { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .frame { transition: none; }
      .glow, .rays { animation: none; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="cam">
      <img class="frame" id="frame-a" alt="" />
      <img class="frame" id="frame-b" alt="" />
    </div>
    <div class="rays"></div>
    <div class="glow"></div>
    <canvas id="fx"></canvas>
    <div class="grade"></div>
    <div id="hint">双击全屏 · 移动鼠标可调节 · 按 H 进入纯壁纸模式</div>
    <div id="panel">
      <button type="button" id="prev">上一幕</button>
      <button type="button" id="pause" aria-pressed="false">定格</button>
      <button type="button" id="next">下一幕</button>
      <button type="button" id="scene">晚礼服</button>
      <button type="button" id="petals" aria-pressed="true">花瓣</button>
      <button type="button" id="full">全屏</button>
    </div>
  </div>
  <script>
    const scenes = {
      lace: ["assets/lace-1.jpg", "assets/lace-2.jpg", "assets/lace-3.jpg"],
      dress: ["assets/dress-1.jpg"]
    };

    const viewport = document.getElementById("viewport");
    const cam = document.getElementById("cam");
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const hint = document.getElementById("hint");
    const panel = document.getElementById("panel");
    const pauseBtn = document.getElementById("pause");
    const sceneBtn = document.getElementById("scene");
    const petalsBtn = document.getElementById("petals");

    let front = document.getElementById("frame-a");
    let back = document.getElementById("frame-b");
    let sceneKey = "lace";
    let index = 0;
    let paused = false;
    let petalsOn = true;
    let holdTimer = 0;
    let uiTimer = 0;
    let kenStart = performance.now();
    let pointer = { x: 0, y: 0, tx: 0, ty: 0 };
    let fadeToken = 0;

    const HOLD_MS = 6800;
    const petals = [];
    const motes = [];

    function makePetal(w, h, scatter) {
      return {
        x: Math.random() * w,
        y: scatter ? Math.random() * h : -20 - Math.random() * h * 0.3,
        size: 7 + Math.random() * 11,
        speed: 16 + Math.random() * 34,
        sway: 16 + Math.random() * 36,
        phase: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 1.5,
        alpha: 0.28 + Math.random() * 0.4,
        hue: Math.random() < 0.35 ? "#fff4f8" : "#ffc2d4"
      };
    }

    function makeMote(w, h) {
      return {
        x: w * (0.45 + Math.random() * 0.5),
        y: h * (0.15 + Math.random() * 0.7),
        r: 1 + Math.random() * 2.4,
        phase: Math.random() * Math.PI * 2,
        speed: 0.15 + Math.random() * 0.35,
        alpha: 0.15 + Math.random() * 0.45
      };
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(viewport.clientWidth * dpr);
      canvas.height = Math.floor(viewport.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      petals.length = 0;
      motes.length = 0;
      for (let i = 0; i < 36; i++) petals.push(makePetal(w, h, true));
      for (let i = 0; i < 28; i++) motes.push(makeMote(w, h));
    }

    function srcOf(i) {
      const frames = scenes[sceneKey];
      return frames[(i + frames.length) % frames.length];
    }

    function armHold() {
      window.clearTimeout(holdTimer);
      if (paused || scenes[sceneKey].length < 2) return;
      holdTimer = window.setTimeout(() => go(index + 1), HOLD_MS);
    }

    function go(nextIndex) {
      const frames = scenes[sceneKey];
      if (frames.length < 2) return;
      const next = (nextIndex + frames.length) % frames.length;
      const src = frames[next];
      const token = ++fadeToken;
      const apply = () => {
        if (token !== fadeToken) return;
        back.classList.add("on");
        front.classList.remove("on");
        const swap = front;
        front = back;
        back = swap;
        index = next;
        armHold();
      };
      if (back.getAttribute("src") === src && back.complete && back.naturalWidth) {
        apply();
        return;
      }
      back.onload = () => {
        back.onload = null;
        apply();
      };
      back.onerror = () => {
        back.onerror = null;
        if (token === fadeToken) armHold();
      };
      back.src = src;
    }

    function loadScene(key) {
      sceneKey = key;
      index = 0;
      fadeToken += 1;
      window.clearTimeout(holdTimer);
      front.onload = null;
      back.onload = null;
      front.classList.add("on");
      back.classList.remove("on");
      front.src = srcOf(0);
      if (scenes[key].length > 1) back.src = srcOf(1);
      sceneBtn.textContent = key === "lace" ? "晚礼服" : "蕾丝夜窗";
      armHold();
    }

    function drawPetal(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.hue;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 0.42, p.size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      const kenT = paused ? kenStart : now - kenStart;
      const phase = kenT / 16000;
      const zoom = 1.04 + (Math.sin(phase * Math.PI * 2) * 0.5 + 0.5) * 0.07;
      pointer.x += (pointer.tx - pointer.x) * 0.05;
      pointer.y += (pointer.ty - pointer.y) * 0.05;
      const px = pointer.x * 1.8;
      const py = pointer.y * 1.2;
      const swayX = Math.sin(phase * Math.PI * 2) * 1.4;
      const swayY = Math.cos(phase * Math.PI * 2) * 0.8;
      cam.style.transform = "translate(" + (swayX + px) + "%, " + (swayY + py) + "%) scale(" + zoom.toFixed(4) + ")";

      ctx.clearRect(0, 0, w, h);
      if (petalsOn) {
        for (const p of petals) {
          p.y += p.speed * dt;
          p.x += Math.sin(now * 0.001 + p.phase) * p.sway * dt;
          p.rot += p.spin * dt;
          if (p.y > h + 24) {
            p.y = -20;
            p.x = Math.random() * w;
          }
          drawPetal(p);
        }
        ctx.globalCompositeOperation = "lighter";
        for (const m of motes) {
          const y = m.y + Math.sin(now * 0.001 * m.speed + m.phase) * 10;
          const x = m.x + Math.cos(now * 0.0007 * m.speed + m.phase) * 14;
          ctx.globalAlpha = m.alpha * (0.65 + 0.35 * Math.sin(now * 0.002 + m.phase));
          ctx.fillStyle = "#ffd6e6";
          ctx.beginPath();
          ctx.arc(x, y, m.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      requestAnimationFrame(tick);
    }

    function showUi() {
      if (viewport.classList.contains("clean")) return;
      panel.classList.add("show");
      window.clearTimeout(uiTimer);
      uiTimer = window.setTimeout(() => panel.classList.remove("show"), 2400);
    }

    function togglePause() {
      paused = !paused;
      pauseBtn.setAttribute("aria-pressed", String(paused));
      pauseBtn.textContent = paused ? "继续" : "定格";
      if (paused) {
        kenStart = performance.now() - kenStart;
        window.clearTimeout(holdTimer);
      } else {
        kenStart = performance.now() - kenStart;
        armHold();
      }
    }

    function toggleFull() {
      if (!document.fullscreenElement) viewport.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    document.getElementById("prev").addEventListener("click", () => go(index - 1));
    document.getElementById("next").addEventListener("click", () => go(index + 1));
    pauseBtn.addEventListener("click", togglePause);
    sceneBtn.addEventListener("click", () => loadScene(sceneKey === "lace" ? "dress" : "lace"));
    petalsBtn.addEventListener("click", () => {
      petalsOn = !petalsOn;
      petalsBtn.setAttribute("aria-pressed", String(petalsOn));
    });
    document.getElementById("full").addEventListener("click", toggleFull);

    viewport.addEventListener("pointermove", (event) => {
      const rect = viewport.getBoundingClientRect();
      pointer.tx = (event.clientX - rect.left) / rect.width * 2 - 1;
      pointer.ty = (event.clientY - rect.top) / rect.height * 2 - 1;
      showUi();
    });
    viewport.addEventListener("dblclick", toggleFull);
    window.addEventListener("resize", resize);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") go(index + 1);
      else if (event.key === "ArrowLeft") go(index - 1);
      else if (event.key === " ") { event.preventDefault(); togglePause(); }
      else if (event.key === "f" || event.key === "F") toggleFull();
      else if (event.key === "p" || event.key === "P") petalsBtn.click();
      else if (event.key === "h" || event.key === "H") {
        viewport.classList.toggle("clean");
        hint.style.display = "none";
      } else if (event.key === "1") loadScene("lace");
      else if (event.key === "2") loadScene("dress");
    });

    const params = new URLSearchParams(location.search);
    if (params.has("clean")) viewport.classList.add("clean");
    window.setTimeout(() => { hint.style.opacity = "0"; }, 4200);

    for (const list of Object.values(scenes)) {
      for (const src of list) {
        const img = new Image();
        img.src = src;
      }
    }

    resize();
    loadScene("lace");
    requestAnimationFrame(tick);
  </script>
</body>
</html>
