retest_policy_2026:
  basis: 复试分数基本要求与教育部公布的全国硕士招生复试分数基本要求（A 区国家线）相同，各学院可自主上调
  detail: 详见《南京农业大学2026年硕士研究生进入复试成绩基本要求》及 003 资环学院复试细则（1717 号通知附件）
  format: 一志愿考生线下复试（滨江校区），含笔试 + 面试
  admission_rule: 统考生按初试总分与复试总分的综合总成绩排名录取

timeline_hint:
  - 每年 9 月中下旬：研招办发布次年招生章程 + 专业目录（在线目录系统同步上线 gts{year}）
  - 5–7 月：初试科目/专业目录“预通知”，提前告知调整
  - 12 月下旬：全国统考初试
  - 次年 2 月下旬：初试成绩公布；3 月上旬：总分排名
  - 3 月中下旬：国家线、学校复试办法、学院复试细则、复试安排
  - 4 月初：学校拟录取名单公示、调剂通知；5 月：学院拟录取名单（含导师）
