# 南京农业大学 农业资源与环境（一级学科 0903）学术型硕士 —— 核心备考事实库
# 所有条目均附官方来源与核对日期；抓取程序每次运行都会用最新招生目录覆盖“动态”字段，
# 若与本文件不一致，以报告中的“在线招生目录（实时）”一节为准。

meta:
  verified_at: "2026-09-05"
  disclaimer: >-
    2027 年正式招生章程与专业目录以南农研招办 2026 年 9 月公布的版本为准；
    本文件中的 2026 年信息来自研究生院在线招生目录及研招网公开通知。

school:
  name: 南京农业大学
  code: "10307"
  graduate_admissions_site: https://zsgz.njau.edu.cn/
  online_catalog: https://yzglxt.njau.edu.cn/gts2026/zsmlgl/zsml_ss_default.aspx
  wechat_official_account: 南农研招
  admissions_office_phone: 025-84395345
  college:
    name: 资源与环境科学学院
    code: "003"
    site: https://re.njau.edu.cn/
    notice_board: https://re.njau.edu.cn/tzgg/xytz.htm
    phone: 025-84395620
    address: 江苏省南京江北新区滨江大道666号（滨江校区）
    campus_note: 资源与环境科学学院研究生培养地点为滨江校区（2026 年招生章程）

discipline:
  code: "0903"
  name: 农业资源与环境
  level: 一级学科（国家重点学科、江苏省优势学科、国家“双一流”建设学科）
  academic_masters:
    - code: "090301"
      name: 土壤学
      quota_2026: 21
      directions_2026:
        - 01 土壤固碳减排与碳中和
        - 02 土壤生物与生态
        - 03 土壤污染控制与修复
        - 04 土壤资源环境遥感及信息技术
      initial_exam:
        - "101 思想政治理论"
        - "201 英语（一）"
        - "314 数学（农）"
        - "857 农业资源环境概论"
      retest: "0301 农业资源信息系统 或 0305 土壤农化分析"
      remark: 土壤学是国家重点学科和省优势学科，入选国家“双一流”建设学科，拥有国家和省部级平台5个以及“111”创新引智基地。
    - code: "090302"
      name: 植物营养学
      quota_2026: 57
      directions_2026:
        - 01 植物营养生理学与养分管理
        - 02 植物营养遗传与抗逆
        - 03 新型肥料学与根际过程
      initial_exam:
        - "101 思想政治理论"
        - "201 英语（一）"
        - "315 化学（农）"
        - "857 农业资源环境概论"
      retest: "0307 植物营养学"
      remark: 植物营养学是国家重点学科和省优势学科，入选国家“双一流”建设学科，拥有国家和省部级平台5个以及“111”创新引智基地。
  related_programs_same_college:
    - code: "095132"
      name: 资源利用与植物保护（专业学位，农业资源利用方向）
      quota_2026: 88
      initial_exam_2026: "101 / 204 英语（二） / 339 农业知识综合一 / 857 农业资源环境概论"
      change_2027: "第3门 339 改为 315 化学（农）（研招办 2026-05-29 预通知）"
      note: 与学硕共用 857，调剂/对比时常被一起考虑
    - code: "071300"
      name: 生态学（学硕）
      initial_exam_2026: "101 / 201 / 315 化学（农） / 806 普通生态学"
    - code: "083001"
      name: 环境科学（学硕）
      initial_exam_2026: "101 / 201 / 302 数学（二） / 871 环境学基础"
    - code: "083002"
      name: 环境工程（学硕）
      initial_exam_2026: "101 / 201 / 302 数学（二） / 871 环境学基础"
    - code: "085700"
      name: 资源与环境（专业学位）
      initial_exam_2026: "101 / 204 / 302 / 871 环境学基础"

reference_books_2026:
  "857 农业资源环境概论":
    - 《土壤学》（第四版）徐建明主编，中国农业出版社，2019
    - 《环境学基础》鞠美庭主编，化学工业出版社，2010 或最新版
    - 《微生物学》（第8版）沈萍、陈向东，高等教育出版社，2016
    - 《植物生理学》（第三版）武维华主编，科学出版社，2018
  "314 数学（农）": 全国统考科目，无校定参考书；按教育部《数学（农）考试大纲》复习
  "315 化学（农）": 全国统考科目，无校定参考书；按教育部《化学（农）考试大纲》复习
  "0301 农业资源信息系统（复试）":
    - 《农业资源信息系统》（第二版）王人潮、王珂主编，中国农业出版社，2009
  "0305 土壤农化分析（复试）":
    - 《土壤农化分析》（第三版）鲍士旦主编，中国农业出版社，2000
  "0307 植物营养学（复试）":
    - 《植物营养学》张俊伶主编，中国农业大学出版社，2021
    - 《遗传学》（第四版）朱军主编，中国农业出版社，2018

