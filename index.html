<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>可观测宇宙模拟</title>
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,560;7..72,680&family=Outfit:wght@360;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23e0b56a' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f6e2b8'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <p class="brand-kicker">ΛCDM · 粒子视界</p>
          <h1>可观测宇宙</h1>
        </div>
        <div class="chips">
          <p><span>年龄</span><strong id="chip-age">—</strong></p>
          <p><span>红移</span><strong id="chip-z">—</strong></p>
          <p><span>温度</span><strong id="chip-t">—</strong></p>
        </div>
        <div class="top-actions">
          <button type="button" id="export-png">导出图像</button>
          <button type="button" id="open-about">说明</button>
        </div>
      </header>
      <aside id="left" class="panel left"></aside>
      <main id="viewport" class="viewport">
        <div class="vignette"></div>
        <div class="corners" aria-hidden="true"></div>
        <div class="hud-tl">
          <p class="hud-kicker">当前尺度</p>
          <h2 id="hud-scale">可观测宇宙</h2>
        </div>
        <div class="hud-bl">
          <div class="legend">
            <span><i class="swatch knot"></i>节点</span>
            <span><i class="swatch fil"></i>纤维</span>
            <span><i class="swatch shell"></i>最后散射面</span>
          </div>
          <div class="scalebar"><i id="scale-line"></i><b id="scale-label"></b></div>
          <p id="hud-note"></p>
        </div>
        <div class="hud-br" id="hud-camera"></div>
        <div id="tooltip" hidden></div>
        <div id="toast" class="toast" hidden></div>
      </main>
      <aside id="right" class="panel right"></aside>
      <footer id="timeline" class="timeline"></footer>
    </div>
    <dialog id="about"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
