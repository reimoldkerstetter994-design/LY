<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LY · 三十分钟</title>
  <link rel="stylesheet" href="css/film.css">
</head>
<body>
  <div id="app" tabindex="-1">
    <canvas id="picture" aria-label="LY 艺术宣传片画面"></canvas>
    <div id="frame"></div>
    <div id="plate" data-tone="dark">
      <p id="kicker"></p>
      <h1 id="hero"></h1>
      <p id="line"></p>
    </div>
    <button id="replay" type="button" hidden>再看一遍</button>
    <div id="hud">
      <div id="time">
        <span id="elapsed">00:00</span>
        <span id="total">30:00</span>
      </div>
      <div id="track">
        <div id="fill"></div>
        <input id="scrub" type="range" min="0" max="1800" step="0.1" value="0" aria-label="影片进度">
      </div>
      <nav id="chapters" aria-label="章节"></nav>
    </div>
  </div>
  <div id="gate">
    <div class="gate-inner">
      <p class="gate-mark">LY</p>
      <p class="gate-line">光，被放回它的位置</p>
      <p class="gate-meta">30:00 · 高清 · 2.39:1</p>
      <button id="start" type="button">开始放映</button>
      <p class="gate-hint">全屏观看 · 空格暂停 · 方向键进退</p>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
