<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音乐搜 · 在线音乐搜索</title>
  <meta name="description" content="在线搜索全球音乐:歌曲、歌手、专辑、MV,支持 30 秒在线试听。双击本文件即可在浏览器中使用,无需服务器。" />
  <link rel="preconnect" href="https://itunes.apple.com" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
  <style>
    :root {
      --bg: #0b0d14;
      --bg-card: #151827;
      --bg-card-hover: #1c2033;
      --text: #eef0f6;
      --text-dim: #8b90a5;
      --accent: #7c5cff;
      --accent-2: #38bdf8;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 96px;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 300px at 20% -5%, rgba(124, 92, 255, 0.18), transparent 70%),
        radial-gradient(500px 260px at 85% 0%, rgba(56, 189, 248, 0.14), transparent 70%);
      z-index: 0;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .site-header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 20px;
    }

    .tagline {
      color: var(--text-dim);
      font-size: 14px;
    }

    /* Hero + search */
    .hero {
      text-align: center;
      padding: 56px 0 28px;
    }

    .hero h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-sub {
      margin-top: 10px;
      color: var(--text-dim);
      font-size: 16px;
    }

    .search-box {
      margin: 28px auto 0;
      max-width: 640px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 6px 6px 18px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      padding: 10px 4px;
      min-width: 0;
    }

    #search-input::placeholder {
      color: var(--text-dim);
    }

    .search-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .search-btn:hover {
      opacity: 0.9;
    }

    .search-btn:active {
      transform: scale(0.97);
    }

    /* Filters */
    .filters {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .filter-group {
      display: inline-flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
    }

    .tab {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 600;
    }

    .region-select {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .region-select select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }

    /* Hot keywords */
    .hot-keywords {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
    }

    .hot-label {
      color: var(--text-dim);
    }

    .hot-tag {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .hot-tag:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Status */
    .status {
      text-align: center;
      padding: 24px 0 8px;
      color: var(--text-dim);
      font-size: 15px;
      min-height: 24px;
    }

    .status .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -4px;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status .error {
      color: #f87171;
    }

    /* Results grid */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 16px 0 32px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.18s, background 0.18s, border-color 0.18s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--bg-card-hover);
      border-color: rgba(124, 92, 255, 0.4);
    }

    .card-art-wrap {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: #0e1120;
    }

    .card-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-art-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      color: var(--text-dim);
    }

    .play-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s, transform 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .card:hover .play-btn,
    .play-btn.playing {
      opacity: 1;
      transform: translateY(0);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(124, 92, 255, 0.14);
      color: #b7a6ff;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
    }

    .card-link {
      color: var(--accent-2);
      text-decoration: none;
      font-size: 12px;
      margin-left: auto;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    /* Load more */
    .load-more-wrap {
      text-align: center;
      padding-bottom: 40px;
    }

    .load-more {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 36px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .load-more:hover {
      border-color: var(--accent);
    }

    .hidden {
      display: none !important;
    }

    /* Player bar */
    .player-bar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 32px));
      background: rgba(21, 24, 39, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      z-index: 100;
    }

    .player-art {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: #0e1120;
    }

    .player-info {
      min-width: 0;
      width: 180px;
      flex-shrink: 0;
    }

    .player-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-toggle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-progress {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
    }

    .player-progress-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .player-time {
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .player-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      padding: 6px;
    }

    .player-close:hover {
      color: var(--text);
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 20px 0;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    @media (max-width: 560px) {
      .player-info {
        width: 110px;
      }
      .player-time {
        display: none;
      }
      .hero {
        padding-top: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">音乐搜</span>
      </a>
      <p class="tagline">一站式在线查找全球音乐</p>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>想听什么,搜就对了</h1>
      <p class="hero-sub">搜索歌曲、歌手、专辑和 MV,即刻在线试听</p>

      <form id="search-form" class="search-box" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="输入歌名、歌手或专辑,例如:周杰伦、Taylor Swift…"
          autocomplete="off"
          autofocus
        />
        <button type="submit" class="search-btn">搜索</button>
      </form>

      <div class="filters">
        <div class="filter-group" id="type-tabs" role="tablist" aria-label="搜索类型">
          <button class="tab active" data-entity="song" role="tab" aria-selected="true">歌曲</button>
          <button class="tab" data-entity="album" role="tab" aria-selected="false">专辑</button>
          <button class="tab" data-entity="musicArtist" role="tab" aria-selected="false">歌手</button>
          <button class="tab" data-entity="musicVideo" role="tab" aria-selected="false">MV</button>
        </div>
        <label class="region-select">
          <span>地区</span>
          <select id="country-select">
            <option value="CN" selected>中国大陆</option>
            <option value="HK">中国香港</option>
            <option value="TW">中国台湾</option>
            <option value="US">美国</option>
            <option value="JP">日本</option>
            <option value="KR">韩国</option>
            <option value="GB">英国</option>
            <option value="DE">德国</option>
            <option value="FR">法国</option>
          </select>
        </label>
      </div>

      <div class="hot-keywords" id="hot-keywords">
        <span class="hot-label">热门:</span>
      </div>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="results" class="results-grid" aria-label="搜索结果"></section>

    <div class="load-more-wrap">
      <button id="load-more" class="load-more hidden">加载更多</button>
    </div>
  </main>

  <div id="player-bar" class="player-bar hidden">
    <img id="player-art" class="player-art" src="" alt="" />
    <div class="player-info">
      <div id="player-title" class="player-title"></div>
      <div id="player-artist" class="player-artist"></div>
    </div>
    <button id="player-toggle" class="player-toggle" aria-label="播放/暂停">▶</button>
    <div class="player-progress" id="player-progress">
      <div class="player-progress-inner" id="player-progress-inner"></div>
    </div>
    <span id="player-time" class="player-time">0:00 / 0:30</span>
    <button id="player-close" class="player-close" aria-label="关闭播放器">✕</button>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>数据来源:iTunes Search API · 试听片段约 30 秒 · 仅供学习交流</p>
    </div>
  </footer>

  <script>
    (() => {
      "use strict";

      const API_BASE = "https://itunes.apple.com/search";
      const PAGE_SIZE = 30;

      const HOT_KEYWORDS = [
        "周杰伦", "邓紫棋", "林俊杰", "Taylor Swift", "五月天", "薛之谦", "Beyond", "Ed Sheeran",
      ];

      const ENTITY_CONFIG = {
        song: { label: "歌曲" },
        album: { label: "专辑" },
        musicArtist: { label: "歌手" },
        musicVideo: { label: "MV" },
      };

      const els = {
        form: document.getElementById("search-form"),
        input: document.getElementById("search-input"),
        tabs: document.getElementById("type-tabs"),
        country: document.getElementById("country-select"),
        hot: document.getElementById("hot-keywords"),
        status: document.getElementById("status"),
        results: document.getElementById("results"),
        loadMore: document.getElementById("load-more"),
        playerBar: document.getElementById("player-bar"),
        playerArt: document.getElementById("player-art"),
        playerTitle: document.getElementById("player-title"),
        playerArtist: document.getElementById("player-artist"),
        playerToggle: document.getElementById("player-toggle"),
        playerProgress: document.getElementById("player-progress"),
        playerProgressInner: document.getElementById("player-progress-inner"),
        playerTime: document.getElementById("player-time"),
        playerClose: document.getElementById("player-close"),
      };

      const state = {
        term: "",
        entity: "song",
        country: "CN",
        offset: 0,
        loading: false,
        lastRequestId: 0,
      };

      const audio = new Audio();
      audio.preload = "none";
      let currentPlayBtn = null;

      /* ---------- 工具函数 ---------- */

      function formatDuration(ms) {
        if (!ms) return "";
        const total = Math.round(ms / 1000);
        const m = Math.floor(total / 60);
        const s = String(total % 60).padStart(2, "0");
        return `${m}:${s}`;
      }

      function formatTime(sec) {
        if (!isFinite(sec)) sec = 0;
        const m = Math.floor(sec / 60);
        const s = String(Math.floor(sec % 60)).padStart(2, "0");
        return `${m}:${s}`;
      }

      function hiResArtwork(url) {
        return url ? url.replace(/100x100bb/, "400x400bb") : "";
      }

      function setStatus(html) {
        els.status.innerHTML = html || "";
      }

      /* ---------- 搜索 ---------- */

      async function search({ append = false } = {}) {
        const term = state.term.trim();
        if (!term) return;

        state.loading = true;
        const requestId = ++state.lastRequestId;

        if (!append) {
          els.results.innerHTML = "";
          els.loadMore.classList.add("hidden");
          setStatus('<span class="spinner"></span>正在搜索…');
        } else {
          els.loadMore.textContent = "加载中…";
          els.loadMore.disabled = true;
        }

        const params = new URLSearchParams({
          term,
          media: "music",
          entity: state.entity,
          country: state.country,
          limit: String(PAGE_SIZE),
          offset: String(state.offset),
        });

        try {
          const res = await fetch(`${API_BASE}?${params}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          // 用户在等待期间发起了新搜索,丢弃过期结果
          if (requestId !== state.lastRequestId) return;

          const items = data.results || [];

          if (!append && items.length === 0) {
            setStatus(`没有找到与「${escapeHtml(term)}」相关的${ENTITY_CONFIG[state.entity].label},换个关键词或地区试试`);
            return;
          }

          if (!append) {
            setStatus(`为你找到 ${items.length}${items.length >= PAGE_SIZE ? "+" : ""} 条「${escapeHtml(term)}」的结果`);
          }

          renderResults(items, { append });

          state.offset += items.length;
          if (items.length >= PAGE_SIZE) {
            els.loadMore.classList.remove("hidden");
          } else {
            els.loadMore.classList.add("hidden");
          }
        } catch (err) {
          if (requestId !== state.lastRequestId) return;
          setStatus(`<span class="error">搜索失败:${escapeHtml(err.message)},请检查网络后重试</span>`);
        } finally {
          state.loading = false;
          els.loadMore.textContent = "加载更多";
          els.loadMore.disabled = false;
        }
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      /* ---------- 渲染 ---------- */

      function renderResults(items, { append }) {
        const frag = document.createDocumentFragment();
        for (const item of items) {
          frag.appendChild(createCard(item));
        }
        if (!append) els.results.innerHTML = "";
        els.results.appendChild(frag);
      }

      function createCard(item) {
        const card = document.createElement("article");
        card.className = "card";

        const kind = item.wrapperType === "artist" ? "artist"
          : item.wrapperType === "collection" ? "album"
          : item.kind === "music-video" ? "mv"
          : "song";

        const title = item.trackName || item.collectionName || item.artistName || "未知";
        const artist = item.artistName || "";
        const album = item.collectionName || "";
        const artwork = hiResArtwork(item.artworkUrl100);
        const year = item.releaseDate ? new Date(item.releaseDate).getFullYear() : "";
        const genre = item.primaryGenreName || "";
        const duration = formatDuration(item.trackTimeMillis);
        const link = item.trackViewUrl || item.collectionViewUrl || item.artistLinkUrl || "";
        const preview = item.previewUrl || "";

        const artWrap = document.createElement("div");
        artWrap.className = "card-art-wrap";
        if (artwork) {
          const img = document.createElement("img");
          img.className = "card-art";
          img.loading = "lazy";
          img.src = artwork;
          img.alt = title;
          artWrap.appendChild(img);
        } else {
          const ph = document.createElement("div");
          ph.className = "card-art-placeholder";
          ph.textContent = kind === "artist" ? "🎤" : "🎵";
          artWrap.appendChild(ph);
        }

        if (preview) {
          const playBtn = document.createElement("button");
          playBtn.className = "play-btn";
          playBtn.textContent = "▶";
          playBtn.title = "试听 30 秒";
          playBtn.addEventListener("click", () => togglePreview(playBtn, item));
          artWrap.appendChild(playBtn);
        }

        const body = document.createElement("div");
        body.className = "card-body";

        const titleEl = document.createElement("div");
        titleEl.className = "card-title";
        titleEl.textContent = title;
        body.appendChild(titleEl);

        if (kind !== "artist" && artist) {
          const sub = document.createElement("div");
          sub.className = "card-sub";
          sub.textContent = artist + (kind === "song" && album ? ` · ${album}` : "");
          sub.title = sub.textContent;
          body.appendChild(sub);
        }

        const meta = document.createElement("div");
        meta.className = "card-meta";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = kind === "artist" ? "歌手" : kind === "album" ? "专辑" : kind === "mv" ? "MV" : "歌曲";
        meta.appendChild(badge);

        const metaBits = [genre, year, duration].filter(Boolean).join(" · ");
        if (metaBits) {
          const span = document.createElement("span");
          span.textContent = metaBits;
          meta.appendChild(span);
        }

        if (link) {
          const a = document.createElement("a");
          a.className = "card-link";
          a.href = link;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "详情 ↗";
          meta.appendChild(a);
        }

        body.appendChild(meta);
        card.appendChild(artWrap);
        card.appendChild(body);
        return card;
      }

      /* ---------- 试听播放器 ---------- */

      function togglePreview(btn, item) {
        const url = item.previewUrl;
        if (audio.src === url && !audio.paused) {
          audio.pause();
          return;
        }

        if (audio.src !== url) {
          audio.src = url;
          els.playerArt.src = hiResArtwork(item.artworkUrl100) || "";
          els.playerTitle.textContent = item.trackName || item.collectionName || "";
          els.playerArtist.textContent = item.artistName || "";
          els.playerProgressInner.style.width = "0%";
        }

        setActivePlayBtn(btn);
        els.playerBar.classList.remove("hidden");
        audio.play().catch(() => {
          setStatus('<span class="error">试听播放失败,请稍后重试</span>');
        });
      }

      function setActivePlayBtn(btn) {
        if (currentPlayBtn && currentPlayBtn !== btn) {
          currentPlayBtn.textContent = "▶";
          currentPlayBtn.classList.remove("playing");
        }
        currentPlayBtn = btn;
      }

      function syncPlayState(playing) {
        els.playerToggle.textContent = playing ? "❚❚" : "▶";
        if (currentPlayBtn) {
          currentPlayBtn.textContent = playing ? "❚❚" : "▶";
          currentPlayBtn.classList.toggle("playing", playing);
        }
      }

      audio.addEventListener("play", () => syncPlayState(true));
      audio.addEventListener("pause", () => syncPlayState(false));
      audio.addEventListener("ended", () => {
        syncPlayState(false);
        els.playerProgressInner.style.width = "0%";
      });
      audio.addEventListener("timeupdate", () => {
        const dur = audio.duration || 30;
        const pct = (audio.currentTime / dur) * 100;
        els.playerProgressInner.style.width = `${pct}%`;
        els.playerTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(dur)}`;
      });

      els.playerToggle.addEventListener("click", () => {
        if (!audio.src) return;
        if (audio.paused) audio.play();
        else audio.pause();
      });

      els.playerProgress.addEventListener("click", (e) => {
        if (!audio.duration) return;
        const rect = els.playerProgress.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        audio.currentTime = ratio * audio.duration;
      });

      els.playerClose.addEventListener("click", () => {
        audio.pause();
        audio.removeAttribute("src");
        els.playerBar.classList.add("hidden");
        if (currentPlayBtn) {
          currentPlayBtn.textContent = "▶";
          currentPlayBtn.classList.remove("playing");
          currentPlayBtn = null;
        }
      });

      /* ---------- 事件绑定 ---------- */

      els.form.addEventListener("submit", (e) => {
        e.preventDefault();
        state.term = els.input.value;
        state.offset = 0;
        search();
      });

      els.tabs.addEventListener("click", (e) => {
        const tab = e.target.closest(".tab");
        if (!tab) return;
        for (const t of els.tabs.querySelectorAll(".tab")) {
          t.classList.toggle("active", t === tab);
          t.setAttribute("aria-selected", t === tab ? "true" : "false");
        }
        state.entity = tab.dataset.entity;
        if (state.term.trim()) {
          state.offset = 0;
          search();
        }
      });

      els.country.addEventListener("change", () => {
        state.country = els.country.value;
        if (state.term.trim()) {
          state.offset = 0;
          search();
        }
      });

      els.loadMore.addEventListener("click", () => {
        if (!state.loading) search({ append: true });
      });

      for (const kw of HOT_KEYWORDS) {
        const btn = document.createElement("button");
        btn.className = "hot-tag";
        btn.textContent = kw;
        btn.addEventListener("click", () => {
          els.input.value = kw;
          state.term = kw;
          state.offset = 0;
          search();
        });
        els.hot.appendChild(btn);
      }
    })();
  </script>
</body>
</html>
