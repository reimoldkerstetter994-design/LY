[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "njau-are"
version = "1.0.0"
description = "南京农业大学农业资源与环境学硕考研资料实时抓取"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "pypdf>=5.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
njau-are = "njau_are.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
njau_are = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
